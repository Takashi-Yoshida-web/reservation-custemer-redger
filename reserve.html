<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ご予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { --bg:#111; --card:#1c1c1e; --text:#f2f2f2; --sub:#9a9a9f; --accent:#06c755; --err:#ff6b6b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Sans",sans-serif; }
    main { max-width:480px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:22px; margin:0 0 4px; }
    p.lead { color:var(--sub); margin:0 0 24px; font-size:14px; }
    label { display:block; font-size:14px; color:var(--sub); margin:16px 0 6px; }
    input, select, textarea { width:100%; padding:12px; font-size:16px; border-radius:10px; border:1px solid #333; background:var(--card); color:var(--text); }
    button { width:100%; margin-top:28px; padding:14px; font-size:17px; font-weight:bold; border:0; border-radius:12px; background:var(--accent); color:#fff; }
    button:disabled { opacity:.5; }
    .msg { margin-top:16px; font-size:14px; min-height:20px; }
    .msg.err { color:var(--err); }
    .done { text-align:center; padding-top:60px; }
  </style>
</head>
<body>
<main id="app">
  <h1>ご予約</h1>
  <p class="lead">来店のご予定をお知らせください。</p>
  <form id="form">
    <label for="nickname">お名前（ニックネームで大丈夫です）</label>
    <input id="nickname" maxlength="30" required>
    <label for="visitAt">来店予定日時</label>
    <input id="visitAt" type="datetime-local" required>
    <label for="people">人数</label>
    <select id="people"></select>
    <label for="message">ひとこと（任意）</label>
    <textarea id="message" rows="3" maxlength="200"></textarea>
    <button id="submit" type="submit" disabled>予約する</button>
    <div id="msg" class="msg">読み込み中…</div>
  </form>
</main>
<script>
  // ▼ 設定（自分の値に書き換える）
  const LIFF_ID = 'ここに客用LIFFのID';
  const GAS_URL = 'ここにGASのウェブアプリURL';

  const $ = id => document.getElementById(id);
  for (let i = 1; i <= 10; i++) $('people').add(new Option(i + '名', i));

  async function call(payload) {
    payload.idToken = liff.getIDToken();
    // Content-Typeを付けない（text/plain扱い）ことでGASに直接送れる
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    return data;
  }

  function setMsg(text, isErr) {
    $('msg').textContent = text;
    $('msg').className = 'msg' + (isErr ? ' err' : '');
  }

  (async () => {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const init = await call({ action: 'customerInit' });
      if (init.nickname) $('nickname').value = init.nickname;
      $('submit').disabled = false;
      setMsg('');
    } catch (e) {
      setMsg('読み込みに失敗しました：' + e.message, true);
    }
  })();

  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('submit').disabled = true;
    setMsg('送信中…');
    try {
      await call({
        action: 'reserve',
        nickname: $('nickname').value,
        visitAt: $('visitAt').value,
        people: $('people').value,
        message: $('message').value,
      });
      const done = document.createElement('div');
      done.className = 'done';
      done.innerHTML = '<h1>ご予約を受け付けました</h1><p class="lead">お待ちしています。</p>';
      $('app').replaceChildren(done);
      setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 2500);
    } catch (e) {
      setMsg(e.message, true);
      $('submit').disabled = false;
    }
  });
</script>
</body>
</html>
